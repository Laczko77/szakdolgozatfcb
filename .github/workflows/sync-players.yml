name: Sync FC Barcelona Players

on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 04:00 UTC
  workflow_dispatch:      # Manual trigger from the GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run player sync
        run: node scripts/sync-players.js
        env:
          # Sofascore is now the sole source for both squad and stats —
          # the football-data.org key is no longer required by this script.
          SOFASCORE_RAPIDAPI_KEY: ${{ secrets.SOFASCORE_RAPIDAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
